<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>美团商家券查询 · 奕辰</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #f3f6ff; font-family: system-ui, sans-serif; padding: 20px; }
        .container { max-width: 500px; margin: 0 auto; }
        .card { background: white; border-radius: 24px; padding: 20px; margin-bottom: 16px; }
        h3 { font-size: 20px; font-weight: 700; margin-bottom: 16px; }
        textarea { width: 100%; border: 1px solid #ddd; border-radius: 16px; padding: 12px; margin-bottom: 12px; }
        button { width: 100%; background: #555cf4; color: white; border: none; border-radius: 16px; padding: 12px; font-size: 16px; font-weight: 700; cursor: pointer; }
        .info { background: #f8f8f8; border-radius: 16px; padding: 12px; margin-top: 12px; font-size: 13px; word-break: break-all; white-space: pre-wrap; }
        .result { margin-top: 16px; text-align: center; }
        .jump-btn { display: inline-block; background: #27ae60; color: white; padding: 10px 20px; border-radius: 40px; text-decoration: none; }
        .footer { text-align: center; font-size: 12px; margin-top: 20px; }
    </style>
</head>
<body>
<div class="container">
    <div class="card">
        <h3>🔍 美团商家券查询</h3>
        <textarea id="shortLinkInput" rows="2" placeholder="粘贴美团短链接（例如 http://dpurl.cn/pE18Dt1z）"></textarea>
        <button id="queryBtn">立即查询</button>
        <div class="info" id="infoMsg">等待查询...</div>
        <div class="result" id="resultArea"></div>
    </div>
    <div class="footer">
        <a href="https://yc22.cn">← 返回首页导航</a>
    </div>
</div>

<script>
const TEMPLATE = 'https://offsiteact.meituan.com/web/hoae/collection_waimai_v8/index.html?recallBizId=cpsH5Coupon&bizId=0c3bfd35279b4140b3bd8ecbc41301d6&mediumSrc1=0c3bfd35279b4140b3bd8ecbc41301d6&scene=CPS_SELF_SRC&pageSrc1=CPS_SELF_OUT_SRC_H5_LINK&pageSrc2=0c3bfd35279b4140b3bd8ecbc41301d6&pageSrc3=518ac97ffb044d60be7361a0176d1d94&activityId=6&mediaPvId=dafkdsajffjafdfs&mediaUserId=10086&outActivityId=6&hoaePageV=8&p=f661c2cef94b4361b7e8c7f77d1b6573&poi_id_str={SHOP_ID}';

function extractShortUrl(text) {
    let match = text.match(/https?:\/\/dpurl\.cn\/[a-zA-Z0-9]+/);
    if (match) return match[0];
    match = text.match(/dpurl\.cn\/[a-zA-Z0-9]+/);
    if (match) return 'http://' + match[0];
    return null;
}

async function resolveShortUrl(shortUrl) {
    const httpsUrl = shortUrl.replace(/^http:/, 'https:');
    const res = await fetch(`/api/resolve?url=${encodeURIComponent(httpsUrl)}`);
    return await res.text();
}

function extractShopId(longUrl) {
    let match = longUrl.match(/\/external\/poi\/([^?]+)/);
    if (match) return match[1];
    match = longUrl.match(/\/poi\/([^?]+)/);
    if (match) return match[1];
    return null;
}

document.getElementById('queryBtn').onclick = async () => {
    const raw = document.getElementById('shortLinkInput').value.trim();
    const info = document.getElementById('infoMsg');
    const result = document.getElementById('resultArea');
    result.innerHTML = '';
    if (!raw) { info.innerText = '❌ 请输入短链接'; return; }
    const shortUrl = extractShortUrl(raw);
    if (!shortUrl) { info.innerText = '❌ 未找到 dpurl.cn 链接'; return; }
    info.innerText = '⏳ 解析中...';
    const btn = document.getElementById('queryBtn');
    btn.disabled = true;
    try {
        const longUrl = await resolveShortUrl(shortUrl);
        if (!longUrl || !longUrl.startsWith('http')) throw new Error('解析失败');
        info.innerText = `✅ 解析成功\n长链接：${longUrl}`;
        const shopId = extractShopId(longUrl);
        if (!shopId) throw new Error('未找到商家ID');
        const finalUrl = TEMPLATE.replace('{SHOP_ID}', shopId);
        info.innerText += `\n✅ 商家ID：${shopId}`;
        result.innerHTML = `<a href="${finalUrl}" target="_blank" class="jump-btn">🎫 点击跳转美团领券</a>`;
    } catch (err) {
        info.innerText = `❌ 解析失败：${err.message}`;
    } finally {
        btn.disabled = false;
    }
};
</script>
</body>
</html>
